name: Build Flipper App

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout wilibsp
        uses: actions/checkout@v4
        with:
          repository: freewili/wilibsp
          submodules: recursive
          
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi ninja-build python3 git
          
      - name: Setup Pico SDK
        run: |
          git clone --branch 2.3.0 --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk
          git submodule update --init
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV
          
      - name: Create Flipper app files
        run: |
          mkdir -p apps/flipper_zero
          
          # Write CMakeLists.txt (base64 encoded to avoid YAML issues)
          echo "" | base64 -d > apps/flipper_zero/CMakeLists.txt
          
          # Write flipper_app.c (base64 encoded)
          echo "" | base64 -d > apps/flipper_zero/flipper_app.c
          
          # Verify files
          cat apps/flipper_zero/CMakeLists.txt
          echo "---"
          head -10 apps/flipper_zero/flipper_app.c
          
      - name: Add app to main CMakeLists.txt
        run: |
          echo "" >> CMakeLists.txt
          echo "# Flipper Zero App" >> CMakeLists.txt
          echo "add_subdirectory(apps/flipper_zero)" >> CMakeLists.txt
          tail -5 CMakeLists.txt
          
      - name: Build app
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          python3 tools/fw.py build apps/flipper_zero
          
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: FlipperZero-App
          path: build/apps/flipper_zero/*.uf2
