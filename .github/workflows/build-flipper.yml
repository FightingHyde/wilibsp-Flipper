name: Build Flipper App

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout wilibsp
        uses: actions/checkout@v4
        with:
          repository: freewili/wilibsp
          submodules: recursive
          
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi ninja-build python3 git
          
      - name: Setup Pico SDK
        run: |
          git clone --branch 2.3.0 --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk
          git submodule update --init
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV
          
      - name: Create Flipper app
        run: |
          mkdir -p apps/flipper_zero
          
          # Create CMakeLists.txt using Python
          python3 << 'PYEOF'
cmake_content = '''cmake_minimum_required(VERSION 3.20)
set(APP_NAME "FlipperZero")
set(APP_VERSION "0.1.0")
fw2_display_app(${APP_NAME})
target_sources(${APP_NAME} PRIVATE flipper_app.c)
target_link_libraries(${APP_NAME} PRIVATE freewili2_bsp)
'''
          with open('apps/flipper_zero/CMakeLists.txt', 'w') as f:
              f.write(cmake_content)
          PYEOF
          
          # Create app source using Python
          python3 << 'PYEOF'
app_content = '''#include "fw2.h"
#include <FreeRTOS.h>
#include <task.h>

static TaskHandle_t furi_task = NULL;

static void furi_task_entry(void* pvParameters) {
    (void)pvParameters;
    while(1) {
        vTaskDelay(pdMS_TO_TICKS(1000));
    }
}

int flipper_app_main(fw2_app_ctx_t* ctx) {
    (void)ctx;
    xTaskCreateAffinitySet(furi_task_entry, "FuriOS", 8192, NULL,
        configMAX_PRIORITIES - 2, (UBaseType_t)1, &furi_task);
    return 0;
}

void flipper_app_tick(fw2_app_ctx_t* ctx) {
    if(fw2_input_pressed(FW2_BTN_HOME) && fw2_input_held(FW2_BTN_HOME, 1000)) {
        fw2_app_quit(ctx);
    }
}

void flipper_app_exit(void) {
    if(furi_task) vTaskDelete(furi_task);
}

FW2_APP_REGISTER(
    .name = "Flipper Zero",
    .version = "0.1.0",
    .author = "Community",
    .main = flipper_app_main,
    .tick = flipper_app_tick,
    .exit = flipper_app_exit,
);
'''
          with open('apps/flipper_zero/flipper_app.c', 'w') as f:
              f.write(app_content)
          PYEOF
          
      - name: Add app to main CMakeLists.txt
        run: |
          echo "" >> CMakeLists.txt
          echo "# Flipper Zero App" >> CMakeLists.txt
          echo "add_subdirectory(apps/flipper_zero)" >> CMakeLists.txt
          tail -5 CMakeLists.txt
          
      - name: Build app
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          python3 tools/fw.py build apps/flipper_zero
          
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: FlipperZero-App
          path: build/apps/flipper_zero/*.uf2
