name: Build Flipper App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi ninja-build
      - name: Setup Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV
      - name: Build
        run: |
          python3 tools/fw.py build apps/flipper_zero
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: FlipperZero-UF2
          path: build/apps/flipper_zero/*.uf2